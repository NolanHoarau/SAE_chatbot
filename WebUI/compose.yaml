services:
	open-webui:
		image: ghcr.io/open-webui/open-webui:main
		container_name: open-webui
		ports:
			- "3000:8080"
		volumes:
			- open-webui:/app/backend/data
		environment:
			- OLLAMA_BASE_URL=http://host.docker.internal
		extra-hosts:
			- "host.docker.internal:host-gateway"
		restart: always

volumes:
	open-webui:
